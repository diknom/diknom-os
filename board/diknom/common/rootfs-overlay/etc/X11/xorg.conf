# DikNom OS - konfigurasi X
#
# Kenapa fbdev: di VirtualBox dengan controller default (VMSVGA), vmwgfx
# menolak jalan ("unsupported hypervisor") sehingga /dev/dri/card0 tidak ada
# dan driver modesetting mati. Framebuffer /dev/fb0 selalu tersedia
# (vesafb dari GRUB, atau fbdev emulation i915 di laptop), jadi fbdev adalah
# jalur yang paling tidak bisa gagal. Input tetap lewat libinput/udev.
Section "Device"
    Identifier "DikNomFB"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "DikNomScreen"
    Device     "DikNomFB"
    DefaultDepth 24
EndSection

Section "ServerLayout"
    Identifier "DikNomLayout"
    Screen     "DikNomScreen"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AllowEmptyInput" "true"
EndSection
