# DikNom OS - konfigurasi X minimal
#
# Tujuan: X tetap jalan walau auto-detect gagal. Driver dipilih berurutan:
# modesetting (butuh /dev/dri/card0 dari kernel DRM), lalu fbdev sebagai
# cadangan terakhir. Input ditangani libinput lewat udev.
Section "Device"
    Identifier  "DikNomGPU"
    Driver      "modesetting"
    Option      "AccelMethod" "none"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AllowEmptyInput" "true"
    Option "DontVTSwitch"    "false"
EndSection
