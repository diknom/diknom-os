# DikNom OS - menu boot (dibuat post-image.sh, rasa & arsitektur disubstitusi)
insmod all_video
insmod gfxterm
insmod png

# Utamakan resolusi native dari firmware (UEFI/VESA), lalu fallback aman.
# 'auto' = firmware memilih mode terbaik yang didukung layarnya.
set gfxmode=auto,1920x1080,1600x900,1366x768,1280x800,1024x768,800x600
set gfxpayload=keep
terminal_output gfxterm

if [ -f /boot/grub/theme/theme.txt ]; then
    set theme=/boot/grub/theme/theme.txt
    export theme
fi

set default=0
set timeout=8
set timeout_style=menu

menuentry "DikNom OS@LABEL@ @VERSION@ (@ARCH@)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 quiet
    initrd /boot/initrd.img
}

menuentry "DikNom OS@LABEL@ @VERSION@ (@ARCH@) - aman (nomodeset)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 nomodeset
    initrd /boot/initrd.img
}

menuentry "DikNom OS@LABEL@ @VERSION@ (@ARCH@) - debug boot" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 ignore_loglevel
    initrd /boot/initrd.img
}
