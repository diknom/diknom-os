set default=0
set timeout=5

menuentry "DikNom OS @FLAVOR@ @VERSION@ (@ARCH@)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 quiet
    initrd /boot/initrd.img
}

menuentry "DikNom OS @FLAVOR@ @VERSION@ (@ARCH@) - aman (nomodeset)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 nomodeset
    initrd /boot/initrd.img
}

menuentry "DikNom OS @FLAVOR@ @VERSION@ (@ARCH@) - debug boot" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 ignore_loglevel
    initrd /boot/initrd.img
}
