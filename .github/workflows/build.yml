name: Build DIKNOM OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build DIKNOM OS di Debian container
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            debian:bookworm \
            bash build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: diknom-os-iso
          path: diknom-os-1.0-x86_64.iso
          retention-days: 30

      - name: Info hasil build
        run: |
          echo "================================"
          echo "  DIKNOM OS build selesai!"
          echo "================================"
          ls -lh diknom-os-1.0-x86_64.iso
