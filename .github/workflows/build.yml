name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.flavor }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - flavor: normal
            arch: amd64
            qemu: qemu-system-x86_64
            product: diknom-os
          - flavor: normal
            arch: i386
            qemu: qemu-system-i386
            product: diknom-os
          - flavor: lite
            arch: amd64
            qemu: qemu-system-x86_64
            product: diknom-os-lite
          - flavor: lite
            arch: i386
            qemu: qemu-system-i386
            product: diknom-os-lite
    steps:
      - uses: actions/checkout@v4

      - name: Dependensi host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            isolinux syslinux-common syslinux-efi grub-pc-bin grub-efi-amd64-bin \
            grub-efi-ia32-bin mtools dosfstools qemu-system-x86 \
            python3 curl ca-certificates

      - name: Konfigurasi live-build
        run: |
          DIKNOM_FLAVOR="${{ matrix.flavor }}" \
          DIKNOM_ARCH="${{ matrix.arch }}" \
          bash auto/config
          echo "--- paket list dipakai ---"
          ls config/package-lists/
          grep -h . config/package-lists/*.list.chroot | head -5

      - name: Bangun ISO (${{ matrix.flavor }} / ${{ matrix.arch }})
        run: |
          set -o pipefail
          export DIKNOM_VERSION="$(tr -d '[:space:]' < VERSION)"
          sudo -E env DIKNOM_VERSION="$DIKNOM_VERSION" lb build 2>&1 | tail -n 250

      - name: Beri nama ISO
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          SRC=$(ls -1 live-image-*.hybrid.iso 2>/dev/null | head -1)
          [ -n "$SRC" ] || { echo "ISO tidak ditemukan"; ls -lh; exit 1; }
          OUT="${{ matrix.product }}-${VER}-${{ matrix.arch }}.iso"
          mv "$SRC" "$OUT"
          ls -lh "$OUT"
          echo "ISO=$OUT" >> "$GITHUB_ENV"

      - name: Smoke test QEMU (boot, login, apt lewat pkg)
        run: |
          set +e
          rm -f qemu.log /tmp/serial.sock
          ${{ matrix.qemu }} -m 2048 -cdrom "$ISO" -boot d \
            -display none -monitor none \
            -serial unix:/tmp/serial.sock,server,nowait \
            -no-reboot -accel tcg &
          QPID=$!
          python3 tools/smoke-test.py /tmp/serial.sock qemu.log 900
          RC=$?
          kill $QPID 2>/dev/null
          wait $QPID 2>/dev/null
          echo "---- 40 baris terakhir konsol ----"
          tail -n 40 qemu.log | tr -d '\r'
          exit $RC

      - name: Simpan log QEMU
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-log-${{ matrix.flavor }}-${{ matrix.arch }}
          path: qemu.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Simpan ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-${{ matrix.arch }}
          path: "*.iso"
          retention-days: 90

  release:
    name: Terbitkan Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist
      - name: Buat release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.iso \
            --repo "$GITHUB_REPOSITORY" \
            --title "DikNom OS ${GITHUB_REF_NAME}" \
            --generate-notes
