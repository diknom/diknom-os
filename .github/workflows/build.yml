name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Batasi ke satu kombinasi, mis. xfce/amd64 (kosong = semua)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Menyusun daftar kombinasi. Kalau input "only" diisi (mis. xfce/amd64),
  # hanya kombinasi itu yang dibangun — dipakai saat mencari bug supaya satu
  # kegagalan berasal dari satu penyebab. Tanpa input, semua delapan jalan.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          cat > all.json <<'EOF'
          {"include":[
            {"desktop":"gnome","arch":"amd64","qemu":"qemu-system-x86_64"},
            {"desktop":"kde","arch":"amd64","qemu":"qemu-system-x86_64"},
            {"desktop":"xfce","arch":"amd64","qemu":"qemu-system-x86_64"},
            {"desktop":"lxqt","arch":"amd64","qemu":"qemu-system-x86_64"},
            {"desktop":"mate","arch":"amd64","qemu":"qemu-system-x86_64"},
            {"desktop":"lxde","arch":"amd64","qemu":"qemu-system-x86_64"},
            {"desktop":"xfce","arch":"i386","qemu":"qemu-system-i386"},
            {"desktop":"lxde","arch":"i386","qemu":"qemu-system-i386"}
          ]}
          EOF
          ONLY="${{ inputs.only }}"
          if [ -n "$ONLY" ]; then
            M=$(jq -c --arg only "$ONLY" \
              '{include: [.include[] | select((.desktop + "/" + .arch) == $only)]}' all.json)
          else
            M=$(jq -c . all.json)
          fi
          echo "kombinasi: $M"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.desktop }} / ${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Kosongkan disk (ISO desktop besar)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Dependensi host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debian-archive-keyring \
            live-build debootstrap squashfs-tools xorriso \
            isolinux syslinux-common syslinux-efi grub-pc-bin grub-efi-amd64-bin \
            grub-efi-ia32-bin mtools dosfstools qemu-system-x86 \
            python3 curl ca-certificates imagemagick
          # Kunci arsip Debian wajib ada: debootstrap menolak jalan tanpa
          # /usr/share/keyrings/debian-archive-keyring.gpg ("Keyring-based
          # check was requested; aborting accordingly").
          test -f /usr/share/keyrings/debian-archive-keyring.gpg && echo "kunci Debian: ada"

      - name: Pasang live-build dari Debian
        run: |
          # live-build bawaan Ubuntu terlalu tua: ia masih menulis sources.list
          # skema lama (distro/updates) dan mencari Contents di jalur lama,
          # sehingga build Debian 13 gagal berulang di tempat berbeda-beda.
          # Pakai live-build dari Debian sendiri yang sudah mengenal trixie.
          sudo apt-get remove -y live-build >/dev/null 2>&1 || true
          cd /tmp
          POOL=http://deb.debian.org/debian/pool/main/l/live-build/
          LBV=$(curl -s "$POOL" | grep -o 'live-build_[^"]*_all\.deb' | sort -V | tail -1)
          echo "versi Debian terpilih: $LBV"
          wget -q "$POOL$LBV" -O live-build.deb
          sudo dpkg -i live-build.deb || sudo apt-get -f install -y
          echo "--- versi terpasang ---"
          dpkg -s live-build | grep -E '^(Package|Version)'
          lb --version

      - name: Opsi timeout bootloader (diagnostik)
        run: lb config --help 2>/dev/null | grep -iE "timeout|prompt" | head -10 || true

      - name: Konfigurasi live-build
        run: |
          DIKNOM_DESKTOP="${{ matrix.desktop }}" \
          DIKNOM_ARCH="${{ matrix.arch }}" \
          bash auto/config

      - name: Bangun ISO (${{ matrix.desktop }} / ${{ matrix.arch }})
        run: |
          set -o pipefail
          export DIKNOM_VERSION="$(tr -d '[:space:]' < VERSION)"
          sudo -E env DIKNOM_VERSION="$DIKNOM_VERSION" lb build 2>&1 | tail -n 250

      - name: Beri nama ISO
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          SRC=$(ls -1 live-image-*.hybrid.iso 2>/dev/null | head -1)
          [ -n "$SRC" ] || { echo "ISO tidak ditemukan"; ls -lh; exit 1; }
          OUT="diknom-os-${{ matrix.desktop }}-${VER}-${{ matrix.arch }}.iso"
          mv "$SRC" "$OUT"
          ls -lh "$OUT"
          echo "ISO=$OUT" >> "$GITHUB_ENV"

      - name: Periksa isi ISO
        run: |
          set -e
          echo "--- ukuran ---"
          ls -lh "$ISO"
          echo "--- berkas penting (xorriso) ---"
          xorriso -indev "$ISO" -find /live /isolinux /boot/grub -type f 2>/dev/null | sed 's/^/  /' | head -25
          echo "--- grub.cfg: baris kernel ---"
          rm -rf /tmp/iso && mkdir -p /tmp/iso
          xorriso -osirrox on -indev "$ISO" -extract /boot/grub/grub.cfg /tmp/iso/grub.cfg 2>/dev/null || true
          xorriso -osirrox on -indev "$ISO" -extract /isolinux/isolinux.cfg /tmp/iso/isolinux.cfg 2>/dev/null || true
          xorriso -osirrox on -indev "$ISO" -extract /isolinux/menu.cfg /tmp/iso/menu.cfg 2>/dev/null || true
          for f in /tmp/iso/grub.cfg /tmp/iso/isolinux.cfg /tmp/iso/menu.cfg; do
            [ -f "$f" ] || continue
            echo "== $f =="
            grep -E "linux|append|kernel|initrd" "$f" | head -12
          done
          echo "--- El Torito ---"
          xorriso -indev "$ISO" -report_el_torito plain 2>/dev/null | grep -i "el torito" | head -3

      - name: Simpan ISO
        # ISO diunggah SEBELUM smoke test: kalau boot gagal, ISO-nya tetap bisa
        # diunduh dan diperiksa, tidak ikut hilang bersama job yang gagal.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.desktop }}-${{ matrix.arch }}
          path: "*.iso"
          retention-days: 90

      - name: Smoke test QEMU (boot, login, pkg lewat apt)
        run: |
          set +e
          rm -f qemu.log /tmp/serial.sock
          rm -f /tmp/mon.sock
          ${{ matrix.qemu }} -m 2048 -cdrom "$ISO" -boot d \
            -display none -monitor unix:/tmp/mon.sock,server,nowait \
            -serial unix:/tmp/serial.sock,server,nowait \
            -no-reboot -accel tcg 2> qemu.err &
          QPID=$!
          # Melihat layar: kalau serial bisu, penyebabnya ada di sini
          # Menu boot menunggu Enter (tampil di VGA, bukan serial), jadi tes
          # harus menekannya lewat monitor QEMU.
          ( sleep 25; python3 tools/key.py /tmp/mon.sock ret ret ret || true
            sleep 40; python3 tools/screen.py /tmp/mon.sock /tmp/screen-a.ppm || true
            sleep 120; python3 tools/screen.py /tmp/mon.sock /tmp/screen-b.ppm || true ) &
          python3 tools/smoke-test.py /tmp/serial.sock qemu.log 600
          RC=$?
          kill $QPID 2>/dev/null
          wait $QPID 2>/dev/null
          echo "---- stderr QEMU ----"
          cat qemu.err 2>/dev/null | head -20
          echo "---- 40 baris terakhir konsol ----"
          tail -n 40 qemu.log | tr -d '\r'
          exit $RC

      - name: Simpan tangkapan layar
        if: always()
        run: |
          for f in /tmp/screen-a.ppm /tmp/screen-b.ppm; do
            [ -f "$f" ] || continue
            out="${f%.ppm}.png"
            convert "$f" "$out" 2>/dev/null || python3 -c "import sys;print('konversi gagal:', sys.argv[1])" "$f"
          done
          ls -la /tmp/screen-*.png 2>/dev/null || true

      - name: Simpan log QEMU
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-log-${{ matrix.desktop }}-${{ matrix.arch }}
          path: |
            qemu.log
            qemu.err
            /tmp/screen-*.png
          retention-days: 30
          if-no-files-found: ignore

  release:
    name: Terbitkan Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist
      - name: Buat release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.iso \
            --repo "$GITHUB_REPOSITORY" \
            --title "DikNom OS ${GITHUB_REF_NAME}" \
            --generate-notes
